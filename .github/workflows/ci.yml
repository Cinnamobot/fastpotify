name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # projectm-sys asks CMake for the Visual Studio generator, which the runner
  # image no longer satisfies; Ninja inside the MSVC environment builds the
  # same thing without caring which Visual Studio is on. The generator is
  # job-level env, since a GITHUB_ENV write never reached the build script.
  CMAKE_GENERATOR: Ninja

jobs:
  quality:
    name: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # libprojectM reads OpenGL through GLEW on Windows; projectm-sys builds
      # against vcpkg's static-CRT triplet, matching .cargo/config.toml.
      - name: GLEW for libprojectM
        run: vcpkg install glew:x64-windows-static
      - name: MSVC environment for libprojectM
        uses: ilammy/msvc-dev-cmd@v1
      # Only main writes the cache. A pull request reads it and builds on
      # top; letting every branch save its own copy filled the repository's
      # ten-gigabyte cache in a few days, and a full cache evicts the entry
      # the next build wanted.
      - uses: Swatinem/rust-cache@v2
        with:
          # v2: caches from before the projectm-sys fork replay its stale
          # build output instead of compiling the fork.
          prefix-key: v2
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --all-features --no-deps

  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: GLEW for libprojectM
        run: vcpkg install glew:x64-windows-static
      - name: MSVC environment for libprojectM
        uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The demo feature carries the headless render test that lays out every
      # page, panel, and dialog without a display.
      - name: Tests (default features)
        run: cargo test --locked --all-targets
      - name: Tests (all features)
        run: cargo test --locked --all-targets --all-features
      # Platform storage is the one part of the credential path a test can
      # only reach with a real store; the rest of the suite uses the dummy.
      - name: Native credential store (dummy grants)
        timeout-minutes: 2
        run: cargo test --locked --lib credentials::tests::native_store_round_trip -- --ignored --exact
      - name: Documentation tests
        run: cargo test --locked --all-features --doc
      # A build can pass while importing Microsoft's C++ runtime, then fail on
      # a clean user's machine. Inspect the executable CI actually produced.
      - name: Standalone Windows runtime
        shell: pwsh
        run: |
          cargo build --locked
          $imports = & dumpbin /dependents target\debug\fastpotify.exe | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Fastpotify imports an MSVC runtime:`n$runtime" }
